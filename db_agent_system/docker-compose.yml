version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
      POSTGRES_DB: ${POSTGRES_DB:-sample_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts if you want to pre-load data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-sample_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    container_name: db_agent_app
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # Database connection
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dbuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword}
      DB_NAME: ${POSTGRES_DB:-sample_db}
      # Ollama configuration
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434
      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./:/app
      - ./logs:/app/logs

volumes:
  postgres_data:
  ollama_data: 