[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "db_agent_system"
version = "0.1.0"
description = "AI Agent System for PostgreSQL Database Queries"
authors = [
    {name = "DB Agent Team"}
]
readme = "README.md"
requires-python = ">=3.8"

[project.entry-points."aiq.components"]
aiq_workflows = "src.agentiq.register:register_workflow"
aiq_tools = "src.agentiq.register:register_tools"
aiq_llm_providers = "src.agentiq.register:register_llm_providers" 