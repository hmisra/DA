agents:
  - name: "QueryUnderstandingAgent"
    description: "Parses and understands user queries using deepseek-r1:70b"
    llm:
      model: "deepseek-r1:70b"
      temperature: 0
      max_tokens: 8192
      top_p: 0.95
    tasks:
      - name: "parse_query"
        description: "Convert natural language query to structured format"
        input_format: "text"
        output_format: "json"

  - name: "SQLGenerationAgent"
    description: "Generates SQL queries based on structured query parameters"
    llm:
      model: "deepseek-r1:70b"
      temperature: 0
      max_tokens: 8192
      top_p: 0.95
    tasks:
      - name: "generate_sql"
        description: "Create SQL query from structured parameters"
        input_format: "json"
        output_format: "text"

  - name: "DataAnalysisAgent"
    description: "Performs advanced data analysis and generates insights"
    llm:
      model: "deepseek-r1:70b"
      temperature: 0
      max_tokens: 8192
      top_p: 0.95
    tasks:
      - name: "analyze_data"
        description: "Analyze query results and generate insights"
        input_format: "json"
        output_format: "json"

tools:
  - name: "PostgresConnector"
    description: "Manages database connections and query execution"
    module: "tools.database"
    class: "PostgresConnector"

  - name: "DataTransformer"
    description: "Handles data transformation and preprocessing"
    module: "tools.transformer"
    class: "DataTransformer"

flows:
  - name: "FullAnalysisFlow"
    description: "Complete data analysis pipeline"
    steps:
      - agent: "QueryUnderstandingAgent"
        task: "parse_query"
      - agent: "SQLGenerationAgent"
        task: "generate_sql"
      - agent: "DataAnalysisAgent"
        task: "analyze_data" 